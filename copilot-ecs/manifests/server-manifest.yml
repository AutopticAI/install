# copilot/server/manifest.yml
#
# server + scheduler run in ONE ECS task (scheduler as a sidecar), replicating
# docker-compose's `network_mode: service:server` — containers in the same ECS task
# already share a network namespace, so no special config is needed for that part.
#
# config.json is delivered by the `init` sidecar, which pulls it from S3 onto a shared
# EFS volume before `server`/`scheduler` are allowed to start (`depends_on: init: success`).

name: server
type: Backend Service

# Reachable inside the environment at:
#   http://server.<ENV_NAME>.<APP_NAME>.local:9999
#   e.g. http://server.prod.autoptic.local:9999
# This is a PRIVATE hosted zone — only resolvable from another service in the same
# Copilot environment, never from a laptop/browser outside the VPC. Not public.
# Get the real value with: aws servicediscovery list-namespaces

image:
  location: <YOUR_ORG>/server:latest
  port: 9999

cpu: 512       # shared across server, scheduler, and init sidecars — size up if needed
memory: 1024
count: 1
exec: true     # required for `copilot svc exec` / `aws ecs execute-command` debugging

network:
  connect: true   # Service Connect, for other services to reach this one by name
  vpc:
    placement: public   # only needed if your environment has no NAT Gateway

command: ["api", "-config", "/mnt/shared/config.json"]
depends_on:
  init: success
  rbac_mint: success   # tokens exist before the API starts, so enforce never has an open window

# Access control is on by default. To opt out, set AUTH_ENFORCE and AUTH_PERMISSIONS to "false".
# AUTH_TRUSTED_PROXIES: the load balancer is the proxy for every caller. 10.0.0.0/16 is the VPC range
# of `copilot env init --default-config`. Change it if your environment uses another range.
variables:
  AUTH_ENFORCE: "true"
  AUTH_PERMISSIONS: "true"
  AUTH_BOOTSTRAP_SHA_ENABLE: "true"
  AUTH_TRUSTED_PROXIES: 10.0.0.0/16

healthcheck:
  # Replace with a real, cheap endpoint that proves the app is actually serving traffic —
  # not just that the process is running.
  command: ["CMD-SHELL", "curl -sf http://localhost:9999/<YOUR_HEALTH_ENDPOINT> || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 15s

storage:
  volumes:
    sharedfiles:
      path: /mnt/shared
      read_only: true    # server only reads config.json — write access is init-only, below
      efs:
        uid: 10002        # must be unique across all EFS volumes in this environment
        gid: 10002

sidecars:
  init:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    essential: false
    # GOTCHA: this image's own ENTRYPOINT is already `/usr/local/bin/aws`. If you only set
    # `command` without overriding `entrypoint`, ECS runs `aws sh -c "..."` (entrypoint +
    # command concatenated) — invalid syntax, exits with code 252. Always override both.
    entrypoint: ["/bin/sh", "-c"]
    # chmod 600: each caller that can read config.json can fetch every role token through
    # bootstrap. The EFS access point maps every client to one POSIX user, so only the containers
    # of this task can still read it.
    command: ["aws s3 cp s3://<DEPLOY_ARTIFACTS_BUCKET>/config.json /mnt/shared/config.json && chmod 600 /mnt/shared/config.json"]
    mount_points:
      - source_volume: sharedfiles
        path: /mnt/shared
        read_only: false   # init needs write access to actually place the file

  # Runs "setup --run". It creates the DynamoDB tables and the S3 snapshot bucket when they are
  # missing, and changes nothing that exists, so every task start can run it. The api command
  # does not create tables, and rbac_mint needs them.
  setup_run:
    image: <YOUR_ORG>/server:latest
    essential: false
    command: ["setup", "--run", "/mnt/shared/config.json"]
    depends_on:
      init: success
    mount_points:
      - source_volume: sharedfiles
        path: /mnt/shared
        read_only: true

  # Runs "setup --rbac" before server and scheduler start. It mints the role and machine tokens. It
  # never replaces a value that exists, so a task restart is safe. It logs the ids only. README.md
  # ("Access control") shows how to get the role.admin token and how to add the MCP keys.
  rbac_mint:
    image: <YOUR_ORG>/server:latest
    essential: false
    command: ["setup", "--rbac", "/mnt/shared/config.json"]
    depends_on:
      setup_run: success
    variables:
      MCP_SERVER_ID: <MCP_SERVER_ID>   # a lowercase slug, for example autoptic-mcp
    secrets:
      MCP_SERVER_TOKEN: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/mcp_server_token
    mount_points:
      - source_volume: sharedfiles
        path: /mnt/shared
        read_only: true

  scheduler:
    image: <YOUR_ORG>/server:latest
    command: ["scheduler", "-config", "/mnt/shared/config.json"]
    # The scheduler fetches its own token through bootstrap, so it needs no AUTH_* env.
    depends_on:
      init: success
      rbac_mint: success
    mount_points:
      - source_volume: sharedfiles
        path: /mnt/shared
        read_only: true
