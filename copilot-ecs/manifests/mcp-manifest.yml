# copilot/mcp/manifest.yml
#
# The MCP server. It is a Load Balanced Web Service on the shared load balancer of the
# environment, next to ui. Each service on that load balancer needs its own path: ui has '/', and
# this one has 'mcp'. The load balancer forwards /mcp unchanged, which is the path the MCP server
# serves. MCP clients use http://<environment load balancer DNS>/mcp (or your alias, see
# DNS-TLS-SETUP.md).
# Each MCP client sends its own named API token as Bearer, so this service holds no API token.

name: mcp
type: Load Balanced Web Service

http:
  path: 'mcp'
  healthcheck:
    path: /health

image:
  location: <YOUR_ORG>/mcp:1.10.0   # use 1.10.0 or later
  port: 7000

cpu: 256
memory: 512
count: 1
exec: true

network:
  connect: true
  vpc:
    placement: public   # only needed if your environment has no NAT Gateway

variables:
  SERVER_PORT: "7000"
  AUTOPTIC_API_BASE_URL: http://server.<ENV_NAME>.<APP_NAME>.local:9999/
  MCP_ADMIN_TOOLS_ENABLED: "false"
  MCP_SERVER_ID: <MCP_SERVER_ID>   # the same value as in the server manifest (rbac_mint)

# The credential of this MCP server. Add the same value as mcp.autoptic.service.<MCP_SERVER_ID>
# in the default secret dict. See the README, "Access control".
secrets:
  MCP_SERVER_TOKEN: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/mcp_server_token
