# Connection header for WebSocket upgrades: "upgrade" when the client asks for one, else "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 6767;
    server_name your-domain.example.com;

    location /mcp {
        proxy_pass http://mcp:7000/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    # Not /api/: the UI's own backend is under /api (/api/config, /api/v1/...), so /api/ here would
    # send the UI's calls to the server. The trailing slash on proxy_pass removes the /autoptic-api prefix.
    location /autoptic-api/ {
        proxy_pass http://server:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://ui:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        # The UI uses WebSockets (/ws/socket.io). nginx drops the Upgrade and Connection
        # headers unless they are set here.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
