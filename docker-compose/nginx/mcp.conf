# Connection header for WebSocket upgrades: "upgrade" when the client asks for one, else "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The request path without the /autoptic-api prefix. It uses the raw $request_uri, so the
# percent-encoded ids that the UI puts in path segments reach the server unchanged.
map $request_uri $autoptic_api_uri {
    ~^/autoptic-api(?<rest>/.*)$ $rest;
    default /;
}

server {
    listen 6767;
    server_name your-domain.example.com;

    # Docker's DNS. With the upstream names in variables, nginx resolves them again at request
    # time. Without this, nginx keeps the IP from its start, and after a service is created again
    # (for example `docker compose up -d server scheduler`) it sends requests to an old IP, which
    # can belong to a different container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mcp_upstream mcp;
    set $server_upstream server;
    set $ui_upstream ui;

    location /mcp {
        proxy_pass http://$mcp_upstream:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    # Not /api/: the UI's own backend is under /api (/api/config, /api/v1/...), so /api/ here would
    # send the UI's calls to the server. The map above removes the /autoptic-api prefix.
    location /autoptic-api/ {
        proxy_pass http://$server_upstream:9999$autoptic_api_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://$ui_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        # The UI uses WebSockets (/ws/socket.io). nginx drops the Upgrade and Connection
        # headers unless they are set here.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
