{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autoptic-server.fullname" . }}-mcp
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "autoptic-server.mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      {{- include "autoptic-server.mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "autoptic-server.mcp.labels" . | nindent 8 }}
        {{- with .Values.mcp.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.mcp.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: mcp
        image: "{{ .Values.mcp.image }}"
        imagePullPolicy: {{ .Values.mcp.imagePullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.mcp.service.targetPort }}
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: {{ .Values.mcp.service.targetPort | quote }}
        - name: MCP_SERVER_ID
          value: {{ .Values.mcp.env.serverId | required "mcp.env.serverId is required when mcp.enabled=true" | quote }}
        - name: AUTOPTIC_API_BASE_URL
          value: {{ .Values.mcp.env.apiBaseUrl | quote }}
        - name: MCP_ADMIN_TOOLS_ENABLED
          value: {{ .Values.mcp.env.adminToolsEnabled | quote }}
        - name: MCP_SERVER_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mcp.secretName }}
              key: mcp-server-token
        - name: AUTOPTIC_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mcp.secretName }}
              key: autoptic-api-token
              optional: true
        {{- with .Values.mcp.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.mcp.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.mcp.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
      {{- with .Values.mcp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
