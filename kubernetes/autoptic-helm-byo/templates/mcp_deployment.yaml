{{- if .Values.mcp.enabled }}
{{- /* mcp before 1.11.0 needs MCP_SERVER_TOKEN, which this chart no longer gives. helm upgrade
--reuse-values keeps the old chart default, autoptic/mcp:1.10.0, so stop here with the fix. */}}
{{- $mcpVersion := regexFind ":[0-9]+\\.[0-9]+[^:/]*$" .Values.mcp.image }}
{{- if $mcpVersion }}
{{- $v := splitList "." (trimPrefix ":" $mcpVersion) }}
{{- $major := atoi (index $v 0) }}
{{- $minor := atoi (regexFind "^[0-9]+" (index $v 1)) }}
{{- if or (lt $major 1) (and (eq $major 1) (lt $minor 11)) }}
{{- fail (printf "mcp.image %s is older than 1.11.0. This chart gives mcp no MCP_SERVER_TOKEN, so an older mcp does not start. Set mcp.image to autoptic/mcp:1.11.0 or later. With helm upgrade --reuse-values, add --set mcp.image=autoptic/mcp:1.12.0." .Values.mcp.image) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autoptic-server.fullname" . }}-mcp
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "autoptic-server.mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      {{- include "autoptic-server.mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "autoptic-server.mcp.labels" . | nindent 8 }}
        {{- with .Values.mcp.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.mcp.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: mcp
        image: "{{ .Values.mcp.image }}"
        imagePullPolicy: {{ .Values.mcp.imagePullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.mcp.service.targetPort }}
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: {{ .Values.mcp.service.targetPort | quote }}
        - name: AUTOPTIC_API_BASE_URL
          value: {{ .Values.mcp.env.apiBaseUrl | quote }}
        - name: MCP_ADMIN_TOOLS_ENABLED
          value: {{ .Values.mcp.env.adminToolsEnabled | quote }}
        {{- with .Values.mcp.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.mcp.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.mcp.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
      {{- with .Values.mcp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
