{{- if and .Values.setup.enabled .Values.setup.verifySchema.enabled (not .Values.setup.prepare.enabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "autoptic-server.fullname" . }}-setup-schema-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "autoptic-server.labels" . | nindent 4 }}
    component: setup-schema-config
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.setup.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "autoptic-server.labels" . | nindent 8 }}
        component: setup-schema-config
    spec:
      serviceAccountName: {{ include "autoptic-server.fullname" . }}-setup-restore-sa
      restartPolicy: Never
      containers:
      - name: resolve
        image: {{ .Values.setup.applyImage | default "python:3.11-slim" }}
        imagePullPolicy: {{ .Values.setup.applyImagePullPolicy | default "IfNotPresent" }}
        env:
        - name: NAMESPACE
          value: {{ .Values.namespace.name | quote }}
        - name: CONFIGMAP_NAME
          value: {{ printf "%s-schema-config" (include "autoptic-server.fullname" .) | quote }}
        - name: INSTANCE_ID_SECRET_NAME
          value: {{ .Values.setup.instanceIdSecretName | quote }}
        - name: BASE_CONFIG_JSON
          value: {{ include "autoptic-server.configJson" . | quote }}
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          python3 -m pip install --no-cache-dir --disable-pip-version-check requests
          python3 - <<'PY'
          import base64
          import json
          import os
          import requests

          namespace = os.environ["NAMESPACE"]
          config_secret_name = os.environ["CONFIGMAP_NAME"]
          instance_secret_name = os.environ["INSTANCE_ID_SECRET_NAME"]
          config = json.loads(os.environ["BASE_CONFIG_JSON"])

          host = os.environ.get("KUBERNETES_SERVICE_HOST")
          port = os.environ.get("KUBERNETES_SERVICE_PORT_HTTPS", "443")
          token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

          with open(token_path, "r", encoding="utf-8") as f:
              token = f.read().strip()

          session = requests.Session()
          session.verify = ca_path
          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          })
          timeout = 20
          base = f"https://{host}:{port}/api/v1/namespaces/{namespace}"

          def b64d(s):
              return base64.b64decode(s.encode("utf-8")).decode("utf-8")

          def b64e(s):
              return base64.b64encode(s.encode("utf-8")).decode("utf-8")

          def upsert_config_secret(secret_name, text):
              url = f"{base}/secrets/{secret_name}"
              body = {
                  "apiVersion": "v1",
                  "kind": "Secret",
                  "metadata": {"name": secret_name, "namespace": namespace},
                  "type": "Opaque",
                  "data": {"config.json": b64e(text)},
              }
              r = session.get(url, timeout=timeout)
              if r.status_code == 404:
                  session.post(f"{base}/secrets", data=json.dumps(body), timeout=timeout).raise_for_status()
              elif r.status_code == 200:
                  session.put(url, data=json.dumps(body), timeout=timeout).raise_for_status()
              else:
                  r.raise_for_status()
              print(f"[config] Applied Secret {secret_name}")

          # Prefer the persisted instance Secret so schema verification checks the
          # tables that actually exist, not whatever instance ID was passed at
          # template time (which can go stale on reinstalls/upgrades).
          sec_resp = session.get(f"{base}/secrets/{instance_secret_name}", timeout=timeout)
          if sec_resp.status_code == 200:
              existing = sec_resp.json().get("data", {}) or {}
              if existing.get("instance-id"):
                  config.setdefault("instance", {})["id"] = b64d(existing["instance-id"])
                  print(f"[schema-config] Using instance ID from Secret: {config['instance']['id']}")
              if existing.get("tenant-short-name"):
                  config.setdefault("instance", {})["tenant_short_name"] = b64d(existing["tenant-short-name"])
                  print(f"[schema-config] Using tenant short name from Secret: {config['instance']['tenant_short_name']}")
          else:
              print(f"[schema-config] Secret {instance_secret_name} not found (status {sec_resp.status_code}), using Helm values")

          config_text = json.dumps(config, indent=2) + "\n"

          upsert_config_secret(config_secret_name, config_text)
          PY
{{- end }}
