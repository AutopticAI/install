{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autoptic-server.fullname" . }}-api
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "autoptic-server.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "autoptic-server.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "autoptic-server.api.labels" . | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "autoptic-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: api
        image: "{{ .Values.api.image }}"
        imagePullPolicy: {{ .Values.api.imagePullPolicy }}
        args:
          - "api"
          - "-config"
          - "/server/config.json"
        ports:
        - name: http
          containerPort: {{ .Values.api.service.targetPort }}
          protocol: TCP
        env:
        - name: AUTOPTIC_CMD
          value: {{ .Values.api.env.pqlCommand | default "/server/pql" | quote }}
        {{- include "autoptic-server.awsEnvBlock" . | nindent 8 }}
        {{- if .Values.externalSecrets.enabled }}
        {{- if .Values.externalSecrets.openaiApiKeyPath }}
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.awsSecret.name }}
              key: OPENAI_API_KEY
        {{- end }}
        {{- if .Values.externalSecrets.grokApiKeyPath }}
        - name: GROK_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.awsSecret.name }}
              key: GROK_API_KEY
        {{- end }}
        {{- end }}
        {{- include "autoptic-server.instanceEnvBlock" . | nindent 8 }}
        {{- $auth := .Values.api.auth | default dict }}
        {{- if and (eq (toString $auth.permissions) "true") (ne (toString $auth.enforce) "true") }}
        {{- fail "api.auth.permissions=true requires api.auth.enforce=true" }}
        {{- end }}
        {{- /* An upgrade must not turn on enforce for a release that ran without access control:
             existing clients would stop at once, and tokens that were readable without auth
             would stay valid. The live Deployment of an older chart has no AUTH_ENFORCE env. */}}
        {{- if and .Release.IsUpgrade (eq (toString $auth.enforce) "true") }}
        {{- $live := lookup "apps/v1" "Deployment" .Values.namespace.name (printf "%s-api" (include "autoptic-server.fullname" .)) }}
        {{- if $live }}
        {{- $hadAuth := false }}
        {{- range $c := $live.spec.template.spec.containers }}{{- range $e := ($c.env | default list) }}{{- if eq $e.name "AUTH_ENFORCE" }}{{- $hadAuth = true }}{{- end }}{{- end }}{{- end }}
        {{- if not $hadAuth }}
        {{- fail "This upgrade turns on api.auth.enforce for a release that ran without access control. For this upgrade, set api.auth.enforce=false, api.auth.permissions=false and rbac.mintOnUpgrade=true. Then follow the upgrade steps on the docs page \"Access control\"." }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- range $name, $value := dict "AUTH_ENFORCE" $auth.enforce "AUTH_OBSERVE" $auth.observe "AUTH_PERMISSIONS" $auth.permissions "AUTH_BOOTSTRAP_SHA_ENABLE" $auth.bootstrapShaEnable }}
        - name: {{ $name }}
          value: {{ ternary "" (toString $value) (kindIs "invalid" $value) | quote }}
        {{- end }}
        {{- if $auth.trustedProxies }}
        - name: AUTH_TRUSTED_PROXIES
          value: {{ join "," $auth.trustedProxies | quote }}
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /server/config.json
          subPath: config.json
          readOnly: true
        {{- with .Values.api.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.api.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
      volumes:
      - name: config
        secret:
          secretName: {{ include "autoptic-server.configSecretName" . }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
