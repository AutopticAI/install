{{- if .Values.setup.enabled }}
{{/*
Moves config.json from the ConfigMap to the Secret on upgrade of a release that kept it in the
ConfigMap. Each caller that can read config.json can fetch every role token through bootstrap.

- pre-upgrade: if the Secret does not exist, copy config.json from the ConfigMap. The bytes stay
  the same, so the bootstrap hash does not change. The new pods mount the Secret.
- post-upgrade: remove config.json from the ConfigMaps. This runs only after a successful
  upgrade, so a failed upgrade can still roll back to pods that mount the ConfigMap.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "autoptic-server.fullname" . }}-config-secret-copy
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "autoptic-server.labels" . | nindent 4 }}
    component: config-secret-copy
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.setup.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "autoptic-server.labels" . | nindent 8 }}
        component: config-secret-copy
    spec:
      serviceAccountName: {{ include "autoptic-server.fullname" . }}-setup-restore-sa
      restartPolicy: Never
      containers:
      - name: copy
        image: {{ .Values.setup.applyImage | default "python:3.11-slim" }}
        imagePullPolicy: {{ .Values.setup.applyImagePullPolicy | default "IfNotPresent" }}
        env:
        - name: NAMESPACE
          value: {{ .Values.namespace.name | quote }}
        - name: CONFIGMAP_NAME
          value: {{ include "autoptic-server.configMapName" . | quote }}
        - name: CONFIG_SECRET_NAME
          value: {{ include "autoptic-server.configSecretName" . | quote }}
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          python3 -m pip install --no-cache-dir --disable-pip-version-check requests
          python3 - <<'PY'
          import base64
          import json
          import os
          import requests

          namespace = os.environ["NAMESPACE"]
          configmap_name = os.environ["CONFIGMAP_NAME"]
          config_secret_name = os.environ["CONFIG_SECRET_NAME"]

          host = os.environ.get("KUBERNETES_SERVICE_HOST")
          port = os.environ.get("KUBERNETES_SERVICE_PORT_HTTPS", "443")
          with open("/var/run/secrets/kubernetes.io/serviceaccount/token", "r", encoding="utf-8") as f:
              token = f.read().strip()

          session = requests.Session()
          session.verify = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          })
          timeout = 20
          base = f"https://{host}:{port}/api/v1/namespaces/{namespace}"

          sec_resp = session.get(f"{base}/secrets/{config_secret_name}", timeout=timeout)
          if sec_resp.status_code == 200:
              print(f"[migrate] Secret {config_secret_name} exists. Nothing to copy.")
          elif sec_resp.status_code == 404:
              cm_resp = session.get(f"{base}/configmaps/{configmap_name}", timeout=timeout)
              cm_data = (cm_resp.json().get("data") or {}) if cm_resp.status_code == 200 else {}
              if "config.json" not in cm_data:
                  print(f"[migrate] ConfigMap {configmap_name} has no config.json. Nothing to copy.")
              else:
                  body = {
                      "apiVersion": "v1",
                      "kind": "Secret",
                      "metadata": {"name": config_secret_name, "namespace": namespace},
                      "type": "Opaque",
                      "data": {"config.json": base64.b64encode(cm_data["config.json"].encode("utf-8")).decode("utf-8")},
                  }
                  session.post(f"{base}/secrets", data=json.dumps(body), timeout=timeout).raise_for_status()
                  print(f"[migrate] Copied config.json from ConfigMap {configmap_name} to Secret {config_secret_name}")
          else:
              sec_resp.raise_for_status()
          PY
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "autoptic-server.fullname" . }}-config-secret-strip-sa
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "autoptic-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "autoptic-server.fullname" . }}-config-secret-strip-role
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "autoptic-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "autoptic-server.fullname" . }}-config-secret-strip-binding
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "autoptic-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "autoptic-server.fullname" . }}-config-secret-strip-role
subjects:
- kind: ServiceAccount
  name: {{ include "autoptic-server.fullname" . }}-config-secret-strip-sa
  namespace: {{ .Values.namespace.name }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "autoptic-server.fullname" . }}-config-secret-strip
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "autoptic-server.labels" . | nindent 4 }}
    component: config-secret-strip
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.setup.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "autoptic-server.labels" . | nindent 8 }}
        component: config-secret-strip
    spec:
      serviceAccountName: {{ include "autoptic-server.fullname" . }}-config-secret-strip-sa
      restartPolicy: Never
      containers:
      - name: strip
        image: {{ .Values.setup.applyImage | default "python:3.11-slim" }}
        imagePullPolicy: {{ .Values.setup.applyImagePullPolicy | default "IfNotPresent" }}
        env:
        - name: NAMESPACE
          value: {{ .Values.namespace.name | quote }}
        - name: CONFIG_SECRET_NAME
          value: {{ include "autoptic-server.configSecretName" . | quote }}
        - name: CONFIGMAP_NAMES
          value: {{ printf "%s,%s-schema-config" (include "autoptic-server.configMapName" .) (include "autoptic-server.fullname" .) | quote }}
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          python3 -m pip install --no-cache-dir --disable-pip-version-check requests
          python3 - <<'PY'
          import json
          import os
          import requests

          namespace = os.environ["NAMESPACE"]
          config_secret_name = os.environ["CONFIG_SECRET_NAME"]
          configmap_names = [n for n in os.environ["CONFIGMAP_NAMES"].split(",") if n]

          host = os.environ.get("KUBERNETES_SERVICE_HOST")
          port = os.environ.get("KUBERNETES_SERVICE_PORT_HTTPS", "443")
          with open("/var/run/secrets/kubernetes.io/serviceaccount/token", "r", encoding="utf-8") as f:
              token = f.read().strip()

          session = requests.Session()
          session.verify = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
          })
          timeout = 20
          base = f"https://{host}:{port}/api/v1/namespaces/{namespace}"

          # Remove the key only while the Secret holds the config, so the pods never lose it.
          sec_resp = session.get(f"{base}/secrets/{config_secret_name}", timeout=timeout)
          if sec_resp.status_code != 200:
              print(f"[strip] Secret {config_secret_name} not found (status {sec_resp.status_code}). ConfigMaps left as they are.")
              raise SystemExit(0)

          for name in configmap_names:
              cm_resp = session.get(f"{base}/configmaps/{name}", timeout=timeout)
              if cm_resp.status_code != 200 or "config.json" not in (cm_resp.json().get("data") or {}):
                  continue
              session.patch(
                  f"{base}/configmaps/{name}",
                  data=json.dumps({"data": {"config.json": None}}),
                  headers={"Content-Type": "application/merge-patch+json"},
                  timeout=timeout,
              ).raise_for_status()
              print(f"[strip] Removed config.json from ConfigMap {name}")
          PY
{{- end }}
