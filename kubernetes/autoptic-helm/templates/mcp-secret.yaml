{{- if and .Values.mcp.enabled (not .Values.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mcp.secretName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "autoptic-server.mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  mcp-server-token: {{ .Values.mcp.secrets.mcpServerToken | required "mcp.secrets.mcpServerToken is required when mcp.enabled=true (see README: MCP Server)" }}
  {{- if .Values.mcp.secrets.autopticApiToken }}
  autoptic-api-token: {{ .Values.mcp.secrets.autopticApiToken }}
  {{- end }}
{{- end }}
