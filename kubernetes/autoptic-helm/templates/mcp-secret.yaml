{{- if and .Values.mcp.enabled (not .Values.externalSecrets.enabled) }}
{{/*
mcp-server-token (MCP_SERVER_TOKEN) is the mcp pod's own outbound credential, not a value an
MCP client ever sends. Use mcp.secrets.mcpServerToken if the operator set one by hand. Otherwise
reuse whatever value the Secret already has from a prior install (lookup), so an upgrade does
not silently rotate it out from under already-configured clients. Only generate a fresh random
value when neither exists (a first install). "lookup" returns nothing when running
"helm template"/"--dry-run" with no cluster access, so those modes always take the
freshly-generated branch; that is fine for template rendering, but means a real "helm install"
or "helm upgrade" is what actually persists the token.
*/}}
{{- $existing := lookup "v1" "Secret" .Values.namespace.name .Values.mcp.secretName }}
{{- $mcpServerToken := .Values.mcp.secrets.mcpServerToken }}
{{- if not $mcpServerToken }}
  {{- if and $existing (hasKey $existing.data "mcp-server-token") }}
    {{- $mcpServerToken = index $existing.data "mcp-server-token" | b64dec }}
  {{- else }}
    {{- $mcpServerToken = randAlphaNum 64 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mcp.secretName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "autoptic-server.mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  mcp-server-token: {{ $mcpServerToken }}
  {{- if .Values.mcp.secrets.autopticApiToken }}
  autoptic-api-token: {{ .Values.mcp.secrets.autopticApiToken }}
  {{- end }}
{{- end }}
